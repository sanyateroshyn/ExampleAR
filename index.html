<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AR</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script>
    // Стабілізатор пози: читає "сиру" позу з source (mindar-image-target)
    // і віддає стабільну позу своїм дітям.
    //  - перший трекінг запам'ятовується, далі поза ЗАМОРОЖЕНА (мертва зона);
    //  - розморожується, лише якщо маркер зсунувся більше ніж deadPos / deadRot;
    //  - після розморозки м'яко наздоганяє сиру позу (follow), а при критичному
    //    стрибку (critPos / critRot) наздоганяє швидко;
    //  - коли поза знову заспокоїлась - заморожується на новому місці.
    AFRAME.registerComponent('pose-stabilizer', {
      schema: {
        source:  { type: 'selector' },
        deadPos: { default: 3 },   // мертва зона позиції, % ширини маркера
        deadRot: { default: 2 },   // мертва зона повороту, градуси
        follow:  { default: 8 },   // швидкість наздоганяння, 1/с
        critPos: { default: 35 },  // "критичний" зсув, % ширини маркера
        critRot: { default: 20 }   // "критичний" поворот, градуси
      },
      init() {
        const T = AFRAME.THREE;
        this.rawPos = new T.Vector3();
        this.rawQuat = new T.Quaternion();
        this.rawScale = new T.Vector3(1, 1, 1);
        this.pos = new T.Vector3();
        this.quat = new T.Quaternion();
        this.scl = new T.Vector3(1, 1, 1);
        this.hasPose = false;
        this.following = true;
        this.calm = 0;
        this.el.object3D.visible = false;
      },
      tick(time, delta) {
        const srcEl = this.data.source;
        if (!srcEl) return;
        const input = srcEl.object3D;
        const out = this.el.object3D;

        if (!input.visible) {            // маркер втрачено
          out.visible = false;
          this.hasPose = false;
          return;
        }
        if (input.matrixAutoUpdate) input.updateMatrix();   // demo-режим
        input.matrix.decompose(this.rawPos, this.rawQuat, this.rawScale);

        if (!this.hasPose) {             // перше (або повторне) знаходження
          this.pos.copy(this.rawPos);
          this.quat.copy(this.rawQuat);
          this.scl.copy(this.rawScale);
          this.hasPose = true;
          this.following = true;         // перші кадри ще наздоганяємо, потім заморозимось
          this.calm = 0;
        } else {
          const d = this.data;
          const dt = Math.min(delta || 16, 100) / 1000;
          const unit = this.rawScale.x || 1;
          const posErr = this.rawPos.distanceTo(this.pos) / unit * 100;
          const rotErr = this.rawQuat.angleTo(this.quat) * 180 / Math.PI;

          if (!this.following && (posErr > d.deadPos || rotErr > d.deadRot)) {
            this.following = true;       // реальний рух - розморожуємо
            this.calm = 0;
          }

          if (this.following) {
            const critical = posErr > d.critPos || rotErr > d.critRot;
            const k = 1 - Math.exp(-d.follow * dt);
            const a = critical ? Math.max(k, 0.6) : k;
            this.pos.lerp(this.rawPos, a);
            this.quat.slerp(this.rawQuat, a);
            this.scl.lerp(this.rawScale, a);

            const pe = this.rawPos.distanceTo(this.pos) / unit * 100;
            const re = this.rawQuat.angleTo(this.quat) * 180 / Math.PI;
            if (pe < d.deadPos * 0.5 && re < d.deadRot * 0.5) {
              if (++this.calm >= 6) this.following = false;   // заспокоїлось - морозимо
            } else {
              this.calm = 0;
            }
          }
        }

        out.position.copy(this.pos);
        out.quaternion.copy(this.quat);
        out.scale.copy(this.scl);
        out.visible = true;
      }
    });
  </script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; touch-action: none; }
    #preload-overlay {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(15, 15, 15, 0.88);
      color: #fff;
      font: 16px Arial, sans-serif;
      text-align: center;
    }
    #preload-overlay[hidden] { display: none; }
    #preload-panel { width: min(100%, 360px); }
    #preload-progress { display: block; width: 100%; height: 18px; margin: 16px 0; }
    #preload-error { color: #ffb3b3; }
    #preload-retry { padding: 10px 18px; }
    #demo-banner {
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      left: 12px;
      right: 12px;
      z-index: 9999;
      padding: 10px 14px;
      border-radius: 8px;
      background: rgba(15, 15, 15, 0.8);
      color: #fff;
      font: 14px Arial, sans-serif;
      text-align: center;
      pointer-events: none;
    }
    #tracking-toggle {
      position: fixed;
      top: max(60px, calc(env(safe-area-inset-top) + 48px));
      right: 12px;
      z-index: 9998;
      width: 40px;
      height: 40px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: rgba(15, 15, 15, 0.88);
      color: #fff;
      font-size: 20px;
      line-height: 40px;
      touch-action: manipulation;
    }
    #tracking-toggle[aria-expanded="true"] { background: #2d6cdf; }
    #tracking-controls[hidden] { display: none; }
    #tracking-controls {
      position: fixed;
      top: max(108px, calc(env(safe-area-inset-top) + 96px));
      right: 12px;
      z-index: 9998;
      width: min(280px, calc(100vw - 24px));
      padding: 12px;
      border-radius: 8px;
      background: rgba(15, 15, 15, 0.88);
      color: #fff;
      font: 13px Arial, sans-serif;
    }
    #tracking-controls h2 { margin: 0 0 8px; font-size: 14px; }
    .tracking-control-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 68px 32px 32px;
      align-items: center;
      gap: 6px;
      min-height: 38px;
    }
    .tracking-control-row output { text-align: right; font-variant-numeric: tabular-nums; }
    .tracking-control-row button {
      min-width: 32px;
      min-height: 32px;
      border: 0;
      border-radius: 5px;
      background: #444;
      color: #fff;
      font-size: 18px;
      touch-action: manipulation;
    }
    #sound-toggle {
      position: fixed;
      left: 50%;
      bottom: max(16px, env(safe-area-inset-bottom));
      z-index: 9999;
      transform: translateX(-50%);
      padding: 12px 18px;
      border: 0;
      border-radius: 999px;
      background: rgba(15, 15, 15, 0.85);
      color: #fff;
      font: 16px Arial, sans-serif;
    }
    #sound-toggle[hidden] { display: none; }
  </style>
</head>
<body>
<div id="preload-overlay" role="status" aria-live="polite">
  <div id="preload-panel">
    <div id="preload-label">Підготовка зображень...</div>
    <progress id="preload-progress" max="1" value="0"></progress>
    <div id="preload-error" hidden></div>
    <button id="preload-retry" type="button" hidden>Повторити завантаження</button>
  </div>
</div>
<div id="demo-banner" role="status" hidden>
  Демо трекінгу: натисни картку, щоб перевернути; свайпай, щоб змінити.
</div>
<button id="tracking-toggle" type="button" aria-expanded="true" aria-controls="tracking-controls" aria-label="Сховати налаштування трекінгу" title="Налаштування">&#9881;</button>
<section id="tracking-controls" aria-label="Налаштування трекінгу">
  <h2>Налаштування трекінгу</h2>
  <div class="tracking-control-row">
    <span>filterMinCF</span>
    <output data-tracking-value="filterMinCF" aria-live="polite"></output>
    <button type="button" data-tracking-setting="filterMinCF" data-direction="-1" aria-label="Зменшити filterMinCF" disabled>-</button>
    <button type="button" data-tracking-setting="filterMinCF" data-direction="1" aria-label="Збільшити filterMinCF" disabled>+</button>
  </div>
  <div class="tracking-control-row">
    <span>filterBeta</span>
    <output data-tracking-value="filterBeta" aria-live="polite"></output>
    <button type="button" data-tracking-setting="filterBeta" data-direction="-1" aria-label="Зменшити filterBeta" disabled>-</button>
    <button type="button" data-tracking-setting="filterBeta" data-direction="1" aria-label="Збільшити filterBeta" disabled>+</button>
  </div>
  <div class="tracking-control-row">
    <span>warmupTolerance</span>
    <output data-tracking-value="warmupTolerance" aria-live="polite"></output>
    <button type="button" data-tracking-setting="warmupTolerance" data-direction="-1" aria-label="Зменшити warmupTolerance" disabled>-</button>
    <button type="button" data-tracking-setting="warmupTolerance" data-direction="1" aria-label="Збільшити warmupTolerance" disabled>+</button>
  </div>
  <div class="tracking-control-row">
    <span>missTolerance</span>
    <output data-tracking-value="missTolerance" aria-live="polite"></output>
    <button type="button" data-tracking-setting="missTolerance" data-direction="-1" aria-label="Зменшити missTolerance" disabled>-</button>
    <button type="button" data-tracking-setting="missTolerance" data-direction="1" aria-label="Збільшити missTolerance" disabled>+</button>
  </div>
  <h2 style="margin-top:10px">Стабілізація</h2>
  <div class="tracking-control-row">
    <span>stabPos, %</span>
    <output data-tracking-value="stabPos" aria-live="polite"></output>
    <button type="button" data-tracking-setting="stabPos" data-direction="-1" aria-label="Зменшити stabPos" disabled>-</button>
    <button type="button" data-tracking-setting="stabPos" data-direction="1" aria-label="Збільшити stabPos" disabled>+</button>
  </div>
  <div class="tracking-control-row">
    <span>stabRot, °</span>
    <output data-tracking-value="stabRot" aria-live="polite"></output>
    <button type="button" data-tracking-setting="stabRot" data-direction="-1" aria-label="Зменшити stabRot" disabled>-</button>
    <button type="button" data-tracking-setting="stabRot" data-direction="1" aria-label="Збільшити stabRot" disabled>+</button>
  </div>
  <div class="tracking-control-row">
    <span>stabFollow</span>
    <output data-tracking-value="stabFollow" aria-live="polite"></output>
    <button type="button" data-tracking-setting="stabFollow" data-direction="-1" aria-label="Зменшити stabFollow" disabled>-</button>
    <button type="button" data-tracking-setting="stabFollow" data-direction="1" aria-label="Збільшити stabFollow" disabled>+</button>
  </div>
</section>
<button id="sound-toggle" type="button" aria-pressed="false" hidden>Увімкнути звук</button>
<a-scene mindar-image="imageTargetSrc: ./target.mind;
                       filterMinCF: 0.0001;
                       filterBeta: 10;
                       warmupTolerance: 3;
                       missTolerance: 10;
                       autoStart: false;"
         vr-mode-ui="enabled: false"
         device-orientation-permission-ui="enabled: false">

    <a-assets>
      <img id="1_1_back" src="./1_back.png">
      <img id="2_1_back" src="./2_back.png">
      <img id="3_1_back" src="./3_back.png">
      <video id="sequence-video-1" src="./1.mp4" muted playsinline crossorigin="anonymous" preload="metadata"></video>
      <video id="sequence-video-2" src="./2.mp4" muted playsinline crossorigin="anonymous" preload="metadata"></video>
      <video id="sequence-video-3" src="./3.mp4" muted playsinline crossorigin="anonymous" preload="metadata"></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"
              cursor="fuse: false; rayOrigin: mouse;"
              raycaster="far: 10000; objects: .clickable"></a-camera>

    <!-- сирий трекінг MindAR: з нього лише читається поза -->
    <a-entity id="target" mindar-image-target="targetIndex: 0"></a-entity>

    <!-- стабілізований корінь: сюди переїхав весь контент -->
    <a-entity id="stable-root" pose-stabilizer="source: #target">
      <a-entity id="container" position="0 0 0" scale="1.6 1.6 1.6">
        <a-image id="card-a" class="clickable" src="#1_1_back"
                 material="transparent: true; opacity: 1; depthWrite: false"
                 position="0 0 0" width="1" height="1.481"></a-image>
        <a-image id="card-b" class="clickable" src="#1_1_back"
                 material="transparent: true; opacity: 0; depthWrite: false"
                 position="0 0 -0.001" width="1" height="1.481"></a-image>
        <a-video id="sequence-a" class="clickable" src="#sequence-video-1"
                 material="shader: flat; transparent: true; opacity: 1; depthWrite: false"
                 position="0 0 0.001" width="1" height="1.481"></a-video>
        <a-video id="sequence-b" class="clickable" src="#sequence-video-1"
                 material="shader: flat; transparent: true; opacity: 0; depthWrite: false"
                 position="0 0 0" width="1" height="1.481"></a-video>
      </a-entity>
    </a-entity>
  </a-scene>

  <script>
    const sets = ['1_1', '2_1', '3_1'];
    let setIdx = 0;
    let side = 'front';
    let markerVisible = false;
    let isTransitioning = false;

    const cards = [document.getElementById('card-a'), document.getElementById('card-b')];
    const sequenceCards = [
      document.getElementById('sequence-a'),
      document.getElementById('sequence-b')
    ];
    const sequenceVideos = [
      document.getElementById('sequence-video-1'),
      document.getElementById('sequence-video-2'),
      document.getElementById('sequence-video-3')
    ];
    const target = document.getElementById('target');
    const preloadOverlay = document.getElementById('preload-overlay');
    const preloadLabel = document.getElementById('preload-label');
    const preloadProgress = document.getElementById('preload-progress');
    const preloadError = document.getElementById('preload-error');
    const preloadRetry = document.getElementById('preload-retry');
    const demoBanner = document.getElementById('demo-banner');
    const soundToggle = document.getElementById('sound-toggle');
    const demoMode = new URLSearchParams(window.location.search).get('demo') === '1';
    const scene = document.querySelector('a-scene');
    const trackingControls = document.getElementById('tracking-controls');
    const stableRoot = document.getElementById('stable-root');
    const trackingSettingDefinitions = [
      { key: 'filterMinCF', step: 0.0001, minimum: 0.0001, decimals: 4 },
      { key: 'filterBeta', step: 1, minimum: 0, decimals: 0 },
      { key: 'warmupTolerance', step: 1, minimum: 0, decimals: 0 },
      { key: 'missTolerance', step: 1, minimum: 0, decimals: 0 },
      { key: 'stabPos', step: 0.5, minimum: 0, decimals: 1, local: true, initial: 3 },
      { key: 'stabRot', step: 0.5, minimum: 0, decimals: 1, local: true, initial: 2 },
      { key: 'stabFollow', step: 1, minimum: 1, decimals: 0, local: true, initial: 8 }
    ];
    let trackingSettings = null;
    let activeTrackingPress = null;
    let suppressedTrackingClick = null;
    let activeCard = cards[0];
    let transitionTarget = null;
    let transitionMode = null;
    let isPreloading = false;
    let assetsReady = false;
    let arStarted = false;
    let soundEnabled = false;
    const pendingVideoResets = new WeakMap();
    // ---- що робить кожен напрямок свайпу (міняй тут) ----
    const SWIPE_ACTIONS = {
      left:  'nextSet',
      right: 'prevSet',
      up:    'flip',
      down:  'flip'
    };

    function renderTrackingSettings() {
      trackingSettingDefinitions.forEach(({ key, decimals }) => {
        const output = trackingControls.querySelector(`[data-tracking-value="${key}"]`);
        if (!output) throw new Error(`Tracking setting display is missing: ${key}`);
        output.textContent = trackingSettings[key].toFixed(decimals);
      });
    }

    function initializeTrackingSettings() {
      const sceneSettings = scene.getAttribute('mindar-image');
      if (!sceneSettings) throw new Error('MindAR image tracking settings are unavailable.');

      trackingSettings = Object.fromEntries(
        trackingSettingDefinitions.map(({ key, local, initial }) => [key, local ? initial : sceneSettings[key]])
      );
      trackingSettingDefinitions.forEach(({ key }) => {
        if (!Number.isFinite(trackingSettings[key])) {
          throw new Error(`MindAR image tracking setting is invalid: ${key}`);
        }
      });
      renderTrackingSettings();
      trackingControls.querySelectorAll('button').forEach(button => {
        button.disabled = false;
      });
    }

    function applyStabilization() {
      stableRoot.setAttribute('pose-stabilizer', 'deadPos', trackingSettings.stabPos);
      stableRoot.setAttribute('pose-stabilizer', 'deadRot', trackingSettings.stabRot);
      stableRoot.setAttribute('pose-stabilizer', 'follow', trackingSettings.stabFollow);
    }

    function applyTrackingSettings() {
      applyStabilization();
      const system = scene.systems['mindar-image-system'];
      if (!system) throw new Error('MindAR image tracking is not initialized.');

      const mindarSettings = Object.fromEntries(
        trackingSettingDefinitions
          .filter(({ local }) => !local)
          .map(({ key }) => [key, trackingSettings[key]])
      );
      Object.assign(system, mindarSettings);
      if (!system.controller) return;

      Object.assign(system.controller, mindarSettings);
      system.controller.trackingStates.forEach(({ filter }) => {
        filter.minCutOff = trackingSettings.filterMinCF;
        filter.beta = trackingSettings.filterBeta;
      });
    }

    function adjustTrackingSetting(button) {
      const definition = trackingSettingDefinitions.find(
        setting => setting.key === button.dataset.trackingSetting
      );
      if (!definition) throw new Error(`Unknown tracking setting: ${button.dataset.trackingSetting}`);

      const precision = 10 ** definition.decimals;
      const direction = Number(button.dataset.direction);
      trackingSettings[definition.key] = Math.max(
        definition.minimum,
        Math.round((trackingSettings[definition.key] + direction * definition.step) * precision) / precision
      );
      renderTrackingSettings();
      applyTrackingSettings();
    }

    function stopTrackingRepeat(event) {
      if (!activeTrackingPress ||
          (event && event.pointerId !== activeTrackingPress.pointerId)) return;

      const press = activeTrackingPress;
      window.clearTimeout(press.delayTimer);
      window.clearInterval(press.repeatTimer);
      activeTrackingPress = null;
      if (press.didRepeat) {
        suppressedTrackingClick = { button: press.button, expiresAt: performance.now() + 500 };
      }
    }

    trackingControls.addEventListener('pointerdown', event => {
      const button = event.target.closest('button[data-tracking-setting]');
      if (!button || button.disabled || !event.isPrimary ||
          (event.pointerType === 'mouse' && event.button !== 0)) return;

      stopTrackingRepeat();
      const press = {
        button,
        pointerId: event.pointerId,
        didRepeat: false,
        delayTimer: 0,
        repeatTimer: 0
      };
      activeTrackingPress = press;
      press.delayTimer = window.setTimeout(() => {
        if (activeTrackingPress !== press) return;
        press.didRepeat = true;
        adjustTrackingSetting(button);
        press.repeatTimer = window.setInterval(() => {
          if (activeTrackingPress === press) adjustTrackingSetting(button);
        }, 100);
      }, 1000);
    });

    document.addEventListener('pointerup', stopTrackingRepeat, true);
    document.addEventListener('pointercancel', stopTrackingRepeat, true);
    window.addEventListener('blur', () => {
      stopTrackingRepeat();
      suppressedTrackingClick = null;
    });

    trackingControls.addEventListener('click', event => {
      const button = event.target.closest('button[data-tracking-setting]');
      if (!button) return;

      if (event.detail > 0 && suppressedTrackingClick) {
        const shouldSuppress = suppressedTrackingClick.button === button &&
          performance.now() <= suppressedTrackingClick.expiresAt;
        suppressedTrackingClick = null;
        if (shouldSuppress) {
          event.preventDefault();
          return;
        }
      }
      adjustTrackingSetting(button);
    });
    ['pointerdown', 'pointerup', 'pointercancel'].forEach(eventName => {
      trackingControls.addEventListener(eventName, event => event.stopPropagation());
    });
    if (scene.hasLoaded) initializeTrackingSettings();

    // ---- показати / сховати панель налаштувань ----
    const trackingToggle = document.getElementById('tracking-toggle');
    const PANEL_KEY = 'trackingPanelHidden';

    function setPanelVisible(visible, remember = true) {
      trackingControls.hidden = !visible;
      trackingToggle.setAttribute('aria-expanded', String(visible));
      trackingToggle.setAttribute('aria-label',
        visible ? 'Сховати налаштування трекінгу' : 'Показати налаштування трекінгу');
      if (!visible) stopTrackingRepeat();
      if (remember) {
        try { localStorage.setItem(PANEL_KEY, visible ? '0' : '1'); } catch (error) { /* сховище недоступне */ }
      }
    }

    trackingToggle.addEventListener('click', () => setPanelVisible(trackingControls.hidden));
    ['pointerdown', 'pointerup', 'pointercancel'].forEach(eventName => {
      trackingToggle.addEventListener(eventName, event => event.stopPropagation());
    });

    let panelHiddenBefore = false;
    try { panelHiddenBefore = localStorage.getItem(PANEL_KEY) === '1'; } catch (error) { /* ігноруємо */ }
    if (panelHiddenBefore) setPanelVisible(false, false);

    const actions = {
      nextSet() { setIdx = (setIdx + 1) % sets.length; side = 'front'; },
      prevSet() { setIdx = (setIdx - 1 + sets.length) % sets.length; side = 'front'; },
      flip()    { side = side === 'front' ? 'back' : 'front'; }
    };

    function render(card) {
      const id = `${sets[setIdx]}_back`;
      const img = document.getElementById(id);
      const video = sequenceVideos[setIdx];
      const cardIndex = cards.indexOf(card);
      const height = video.videoWidth && video.videoHeight
        ? video.videoHeight / video.videoWidth
        : (img && img.naturalWidth ? img.naturalHeight / img.naturalWidth : 1.481);
      card.setAttribute('src', '#' + id);
      card.setAttribute('width', 1);
      card.setAttribute('height', height);
      sequenceCards[cardIndex].setAttribute('width', 1);
      sequenceCards[cardIndex].setAttribute('height', height);
      card.setAttribute('material', 'opacity', side === 'back' ? 1 : 0);
      sequenceCards[cardIndex].setAttribute('src', `#${video.id}`);
      sequenceCards[cardIndex].setAttribute('material', 'opacity', side === 'front' ? 1 : 0);
    }

    function animateFade(card, name, from, to, duration = 250) {
      card.removeAttribute(`animation__${name}`);
      card.setAttribute(`animation__${name}`,
        `property: material.opacity; from: ${from}; to: ${to}; dur: ${duration}; easing: easeInOutQuad`);
    }

    function playSequence(cardIndex) {
      if (!markerVisible || side !== 'front' || isTransitioning) return;
      const video = sequenceVideos[setIdx];
      sequenceVideos.forEach(item => {
        if (item !== video) item.pause();
      });
      const pendingReset = pendingVideoResets.get(video);
      if (pendingReset) {
        pendingReset.then(() => {
          if (markerVisible && side === 'front' && !isTransitioning && sequenceVideos[setIdx] === video) {
            playSequence(cardIndex);
          }
        }, error => {
          console.error('Unable to reset the video before playback.', error);
        });
        return;
      }
      video.muted = !soundEnabled;
      video.play().catch(error => {
        console.error(`Unable to play ${video.currentSrc || video.src}.`, error);
      });
    }

    function stopSequence() {
      sequenceVideos.forEach(video => video.pause());
    }

    function resetSequence(video = sequenceVideos[setIdx]) {
      const pendingReset = pendingVideoResets.get(video);
      if (pendingReset) return pendingReset;

      video.pause();
      if (video.readyState >= HTMLMediaElement.HAVE_METADATA &&
          video.currentTime === 0 && !video.seeking) return Promise.resolve();

      let resolveReset;
      let rejectReset;
      const reset = new Promise((resolve, reject) => {
        resolveReset = resolve;
        rejectReset = reject;
      });
      pendingVideoResets.set(video, reset);

      const cleanup = () => {
        video.removeEventListener('loadedmetadata', seekToStart);
        video.removeEventListener('seeked', finishReset);
        video.removeEventListener('error', failReset);
        pendingVideoResets.delete(video);
      };
      const finishReset = () => {
        if (video.seeking || video.currentTime !== 0) return;
        cleanup();
        resolveReset();
      };
      const failReset = () => {
        cleanup();
        rejectReset(video.error || new Error(`Unable to reset ${video.currentSrc || video.src}.`));
      };
      const seekToStart = () => {
        if (video.readyState < HTMLMediaElement.HAVE_METADATA) return;
        if (video.currentTime === 0 && !video.seeking) {
          finishReset();
          return;
        }
        try {
          video.currentTime = 0;
          finishReset();
        } catch (error) {
          cleanup();
          rejectReset(error);
        }
      };

      video.addEventListener('loadedmetadata', seekToStart);
      video.addEventListener('seeked', finishReset);
      video.addEventListener('error', failReset);
      seekToStart();
      return reset;
    }

    async function preloadMedia() {
      if (isPreloading) return;
      isPreloading = true;
      preloadOverlay.hidden = false;
      preloadProgress.hidden = false;
      preloadError.hidden = true;
      preloadRetry.hidden = true;
      preloadRetry.disabled = true;
      preloadRetry.textContent = 'Повторити завантаження';

      const images = ['1_1_back', '2_1_back', '3_1_back']
        .map(id => document.getElementById(id));
      const failures = [];
      let completed = 0;
      preloadProgress.max = images.length;
      preloadProgress.value = completed;
      preloadLabel.textContent = `Завантаження зображень: ${completed} / ${images.length}`;
      await Promise.all(images.map(async media => {
        try {
          await media.decode();
        } catch (error) {
          failures.push(error.message);
        } finally {
          completed++;
          preloadProgress.value = completed;
          preloadLabel.textContent = `Завантаження зображень: ${completed} / ${images.length}`;
        }
      }));
      isPreloading = false;
      preloadRetry.disabled = false;
      if (failures.length) {
        console.error('Some card images failed to preload:', failures);
        preloadLabel.textContent = `Не вдалося завантажити ${failures.length} з ${images.length} зображень.`;
        preloadError.textContent = 'Перевірте з’єднання та повторіть спробу.';
        preloadError.hidden = false;
        preloadRetry.hidden = false;
        return;
      }

      assetsReady = true;
      startAR();
    }

    function startAR() {
      if (arStarted) return;
      if (demoMode) {
        try {
          target.removeAttribute('mindar-image-target');
          target.object3D.matrixAutoUpdate = true;
          target.setAttribute('position', '0 0 -2');
          target.object3D.updateMatrixWorld(true);
          target.setAttribute('visible', true);
          markerVisible = true;
          arStarted = true;
          preloadOverlay.hidden = true;
          demoBanner.hidden = false;
          soundToggle.hidden = false;
          playSequence(cards.indexOf(activeCard));
        } catch (error) {
          arStarted = false;
          preloadLabel.textContent = 'Не вдалося запустити демо.';
          preloadError.textContent = error.message;
          preloadError.hidden = false;
          preloadRetry.textContent = 'Повторити запуск демо';
          preloadRetry.hidden = false;
          console.error('Unable to start tracking demo.', error);
        }
        return;
      }
      preloadOverlay.hidden = false;
      preloadLabel.textContent = 'Зображення готові. Запуск камери...';
      preloadProgress.hidden = true;
      preloadError.hidden = true;
      preloadRetry.hidden = true;
      try {
        const system = scene.systems['mindar-image-system'];
        if (!system) throw new Error('MindAR image tracking is not initialized.');
        arStarted = true;
        system.start();
      } catch (error) {
        arStarted = false;
        preloadLabel.textContent = 'Не вдалося запустити камеру.';
        preloadError.textContent = error.message;
        preloadError.hidden = false;
        preloadRetry.textContent = 'Повторити запуск камери';
        preloadRetry.hidden = false;
        console.error('Unable to start MindAR.', error);
      }
    }

    preloadRetry.addEventListener('click', () => {
      if (assetsReady) startAR();
      else preloadMedia();
    });

    soundToggle.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      sequenceVideos.forEach(video => {
        video.muted = !soundEnabled;
      });
      soundToggle.textContent = soundEnabled ? 'Вимкнути звук' : 'Увімкнути звук';
      soundToggle.setAttribute('aria-pressed', String(soundEnabled));
      if (markerVisible && side === 'front') playSequence(cards.indexOf(activeCard));
    });

    scene.addEventListener('arReady', () => {
      preloadOverlay.hidden = true;
      soundToggle.hidden = false;
    });
    scene.addEventListener('arError', event => {
      arStarted = false;
      preloadOverlay.hidden = false;
      preloadProgress.hidden = true;
      preloadLabel.textContent = 'Не вдалося запустити камеру.';
      preloadError.textContent = event.detail?.error || 'Перевірте дозвіл на використання камери.';
      preloadError.hidden = false;
      preloadRetry.textContent = 'Повторити запуск камери';
      preloadRetry.hidden = false;
    });

    function run(action) {
      if (isTransitioning) return;
      isTransitioning = true;
      transitionMode = action === 'nextSet' || action === 'prevSet' ? 'sequential' : 'crossfade';
      const outgoingVideo = sequenceVideos[setIdx];
      const outgoingSide = side;
      actions[action]();
      const outgoingCard = activeCard;
      const outgoingIndex = cards.indexOf(outgoingCard);
      transitionTarget = cards.find(card => card !== activeCard);
      const incomingIndex = cards.indexOf(transitionTarget);
      stopSequence();
      render(transitionTarget);
      outgoingCard.setAttribute('position', '0 0 -0.001');
      transitionTarget.setAttribute('position', '0 0 0');
      sequenceCards[outgoingIndex].setAttribute('position', '0 0 -0.0005');
      sequenceCards[incomingIndex].setAttribute('position', '0 0 0.001');
      if (transitionMode === 'sequential') {
        transitionTarget.setAttribute('material', 'opacity', 0);
        sequenceCards[incomingIndex].setAttribute('material', 'opacity', 0);
        animateFade(outgoingCard, 'fadeout', outgoingSide === 'back' ? 1 : 0, 0, 120);
        animateFade(sequenceCards[outgoingIndex], 'fadeout', outgoingSide === 'front' ? 1 : 0, 0, 120);
        window.setTimeout(async () => {
          if (transitionMode !== 'sequential' || !transitionTarget) return;
          try {
            await resetSequence(outgoingVideo);
          } catch (error) {
            console.error('Unable to reset the outgoing video.', error);
          }
          if (transitionMode !== 'sequential' || !transitionTarget) return;
          const nextIndex = cards.indexOf(transitionTarget);
          sequenceCards[cards.indexOf(activeCard)].setAttribute('material', 'opacity', 0);
          animateFade(transitionTarget, 'fadein', 0, side === 'back' ? 1 : 0, 120);
          animateFade(sequenceCards[nextIndex], 'fadein', 0, side === 'front' ? 1 : 0, 120);
        }, 130);
      } else {
        animateFade(outgoingCard, 'fadeout', outgoingSide === 'back' ? 1 : 0, 0);
        animateFade(transitionTarget, 'fadein', 0, side === 'back' ? 1 : 0);
        animateFade(sequenceCards[outgoingIndex], 'fadeout', outgoingSide === 'front' ? 1 : 0, 0);
        animateFade(sequenceCards[incomingIndex], 'fadein', 0, side === 'front' ? 1 : 0);
      }
    }

    cards.forEach(card => {
      card.addEventListener('click', () => run('flip'));
      card.addEventListener('animationcomplete__fadein', () => {
        if (card !== transitionTarget) return;
        activeCard = card;
        transitionTarget = null;
        isTransitioning = false;
        transitionMode = null;
        if (side === 'back') {
          resetSequence().catch(error => {
            console.error('Unable to reset the current video.', error);
          });
        }
        else if (markerVisible) playSequence(cards.indexOf(activeCard));
      });
    });

    sequenceCards.forEach(card => {
      card.addEventListener('click', () => run('flip'));
    });

    // ---- видимість маркера ----
    target.addEventListener('targetFound', () => {
      markerVisible = true;
      if (!isTransitioning && side === 'front') playSequence(cards.indexOf(activeCard));
    });
    target.addEventListener('targetLost',  () => {
      markerVisible = false;
      stopSequence();
    });

    // ---- свайп ----
    const MIN_DIST = 40; // px
    let startX = 0, startY = 0, tracking = false;
    let activePointerId = null;
    let suppressClickUntil = 0;

    document.addEventListener('pointerdown', (e) => {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      tracking = true;
      activePointerId = e.pointerId;
      startX = e.clientX;
      startY = e.clientY;
    });

    document.addEventListener('pointerup', (e) => {
      if (!tracking || e.pointerId !== activePointerId) return;
      tracking = false;
      activePointerId = null;
      if (!markerVisible) return;

      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < MIN_DIST) return;

      const dir = Math.abs(dx) > Math.abs(dy)
        ? (dx < 0 ? 'left' : 'right')
        : (dy < 0 ? 'up' : 'down');

      const action = SWIPE_ACTIONS[dir];
      if (action) {
        suppressClickUntil = Date.now() + 500;
        run(action);
      }
    });

    document.addEventListener('pointercancel', () => {
      tracking = false;
      activePointerId = null;
    });

    cards.forEach(card => {
      card.addEventListener('click', event => {
        if (Date.now() >= suppressClickUntil) return;
        event.preventDefault();
        event.stopPropagation();
      }, true);
    });

    scene.addEventListener('loaded', () => {
      if (!trackingSettings) initializeTrackingSettings();
      render(activeCard);
      preloadProgress.hidden = false;
      preloadMedia();
    });
  </script>
</body>
</html>
